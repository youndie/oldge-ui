org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official

version=0.1.0

# What the shared conventions read (`io.github.youndie.sborka`).
sborka.group=io.github.youndie
sborka.repository=youndie/oldge-ui
sborka.description=The oldge-ui design system for Compose Multiplatform.
sborka.inceptionYear=2026
sborka.licence=The Apache License, Version 2.0
sborka.jvmToolchain=25
sborka.jvmFloor=25

# The wasmJs target is the reason: the Kotlin plugin declares repositories on the project for Node,
# Yarn and Binaryen, and the two stricter modes break it (kvadrant-ui gradle.properties has the
# measured failures).
sborka.repositoriesMode=PREFER_PROJECT
