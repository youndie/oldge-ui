<!-- @dsCard group="Экраны" height=800 subtitle="Лента: поиск, чипы, карточки, FAB и снэкбар" page -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>FeedScreen — preview</title>
<style>
.phone { width: 390px; height: 760px; margin: 16px; display: flex; flex-direction: column; border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-window); position: relative;
    background: radial-gradient(120% 60% at 100% 100%, var(--glow), transparent 60%), linear-gradient(var(--body-hi), var(--ground) 70%); }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .scroll > * { flex-shrink: 0; }
  .display { margin: var(--space-2) 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--space-2); }
</style></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function App() {
    var tab = React.useState('all'), f = React.useState('new'), nav = React.useState('home'), snack = React.useState(true), fab = React.useState(false);
    return h('div', { className: 'phone og-textured' },
      h(B.WindowBar, { icon: 'grid', title: 'Лента', actions: [{ icon: 'bell', label: 'События' }] }),
      h('div', { className: 'scroll', style: { paddingTop: 12 } },
        h(B.SearchBar, { placeholder: 'Поиск по ленте', trailing: h(B.Avatar, { size: 'sm', name: 'Павел Вотяков', status: 'online' }) }),
        h(B.ChipGroup, { scroll: true, label: 'Фильтр' },
          h(B.Chip, { kind: 'filter', selected: f[0] === 'new', onPress: function () { f[1]('new'); } }, 'Новое'),
          h(B.Chip, { kind: 'filter', selected: f[0] === 'pop', onPress: function () { f[1]('pop'); } }, 'Популярное'),
          h(B.Chip, { kind: 'filter', selected: f[0] === 'my', onPress: function () { f[1]('my'); } }, 'Моё')),
        h(B.Card, { media: 'image', title: 'Отпуск 2006', subtitle: 'Анна Ким · 148 фото', onPress: function () {} }),
        h(B.Card, { bar: 'Напоминание', barIcon: 'bell', title: 'Резервная копия через час' }, 'Подключите зарядку, чтобы не прерывать.')),
      h('div', { style: { position: 'absolute', right: 16, bottom: snack[0] ? 148 : 88, zIndex: 20, transition: 'bottom var(--og-t3) var(--og-spring)' } },
        h(B.Fab, { icon: 'plus', ariaLabel: 'Создать', expanded: fab[0], onClick: function () { fab[1](!fab[0]); } })),
      snack[0] && h('div', { style: { position: 'absolute', left: 12, right: 12, bottom: 84, zIndex: 30 } },
        h(B.Snackbar, { inline: true, actionLabel: 'Отменить', onClose: function () { snack[1](false); } }, 'Пост сохранён в черновики')),
      h(B.BottomNav, { value: nav[0], onChange: nav[1], items: [
        { id: 'home', icon: 'home', label: 'Лента' }, { id: 'search', icon: 'search', label: 'Поиск' }, { id: 'bell', icon: 'bell', label: 'События' }, { id: 'me', icon: 'user', label: 'Профиль' }] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
