<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo' },
    h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' } }, h(B.Badge, null, 'Черновик'), h(B.Badge, { tone: 'accent' }, 'Новое'), h(B.Badge, { tone: 'accent', count: true }, '12'),
      h(B.Badge, { tone: 'success' }, 'Синхр.'), h(B.Badge, { tone: 'warning' }, 'Мало места'), h(B.Badge, { tone: 'danger' }, 'Ошибка'))));
</script>
</body>
</html>
