<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Snackbar — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function Demo() { var n = React.useState(0);
    return h('div', { className: 'og-demo' },
      h(B.Snackbar, { key: n[0], inline: true, actionLabel: 'Отменить', onAction: function () {}, onClose: function () {} }, 'Файл перемещён в корзину'),
      h(B.Button, { size: 'sm', onClick: function () { n[1](n[0] + 1); } }, 'Показать ещё раз')); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
