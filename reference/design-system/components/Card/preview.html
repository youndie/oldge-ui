<!-- @dsCard group="Контейнеры" height=480 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Card — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo' },
    h(B.Card, { media: 'image', title: 'Отпуск 2006', subtitle: '148 фото · Черногория', onPress: function () {},
      actions: [h(B.Button, { key: 's', size: 'sm' }, 'Поделиться'), h(B.Button, { key: 'o', size: 'sm', variant: 'primary' }, 'Открыть')] }),
    h(B.Card, { bar: 'Резервная копия', barIcon: 'cloud', title: 'Последняя — сегодня, 03:00', subtitle: 'Следующая — завтра' }, 'Сохранено 1 204 файла, ошибок нет.'),
    h(B.Card, { variant: 'sunken', title: 'Журнал', subtitle: 'Только чтение' }, 'Утопленная карточка — для вывода, логов и справки.')));
</script>
</body>
</html>
