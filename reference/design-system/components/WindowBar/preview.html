<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>WindowBar — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo' },
    h(B.WindowBar, { icon: 'grid', title: 'Центр задач', actions: [{ icon: 'help', label: 'Справка' }, { icon: 'close', label: 'Закрыть' }] }),
    h(B.WindowBar, { onBack: function () {}, title: 'Настройки', subtitle: 'Аккаунт и синхронизация', actions: [{ icon: 'search', label: 'Поиск' }] }),
    h(B.WindowBar, { title: 'Файлы', icon: 'folder', center: h(B.Badge, { tone: 'accent', count: true }, '3'), actions: [{ icon: 'plus', label: 'Создать', tone: 'accent' }] })));
</script>
</body>
</html>
