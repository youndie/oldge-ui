<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function Demo() { var s = React.useState('wifi');
    return h('div', { className: 'og-demo' }, h(B.Select, { label: 'Синхронизировать через', value: s[0], onChange: s[1], options: [
      { value: 'wifi', label: 'Только Wi-Fi', icon: 'cloud' }, { value: 'any', label: 'Любую сеть', icon: 'refresh' }, { value: 'off', label: 'Вручную', icon: 'lock' }] })); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
