<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ActionTile — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo' },
    h(B.ActionTile, { icon: 'upload', tone: 'accent', title: 'Создать резервную копию', description: 'Фото, контакты и заметки' }),
    h(B.ActionTile, { icon: 'refresh', tone: 'bezel', title: 'Восстановить из копии' }),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 } },
      h(B.ActionTile, { layout: 'stack', icon: 'image', title: 'Фото' }),
      h(B.ActionTile, { layout: 'stack', icon: 'doc', title: 'Документы' }))));
</script>
</body>
</html>
