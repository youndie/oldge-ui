<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>BottomNav — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function Demo() { var s = React.useState('home');
    return h('div', { className: 'og-demo' }, h(B.BottomNav, { value: s[0], onChange: s[1], items: [
      { id: 'home', icon: 'home', label: 'Главная' }, { id: 'search', icon: 'search', label: 'Поиск' }, { id: 'bell', icon: 'bell', label: 'События' }, { id: 'me', icon: 'user', label: 'Профиль' }] })); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
