<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>NavDrawer — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function Demo() { var v = React.useState('files');
    return h('div', { style: { height: 500, padding: 16, boxSizing: 'border-box' } }, h(B.NavDrawer, { inline: true, value: v[0], onChange: v[1],
      avatar: h(B.Avatar, { name: 'Павел Вотяков', status: 'online' }), title: 'Павел', subtitle: 'pavel@example.com', items: [
      { id: 'home', icon: 'home', label: 'Главная' }, { id: 'files', icon: 'folder', label: 'Файлы', badge: '4' }, { id: 'photo', icon: 'image', label: 'Фото' },
      { section: 'Сервис' }, { id: 'sync', icon: 'refresh', label: 'Синхронизация' }, { id: 'set', icon: 'gear', label: 'Настройки' }, { id: 'help', icon: 'help', label: 'Справка' }] })); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
