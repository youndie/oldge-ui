<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>oldge-ui</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-ui); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .frame { fill:var(--accent); rx:var(--radius-xl); }
  .pill { fill:var(--bezel-lo); rx:var(--radius-lg); }
  .lcd { fill:var(--lcd); rx:var(--radius-xs); }
  .seg { fill:var(--accent); rx:var(--radius-xs); }
  .seg.off { fill:var(--lcd-ghost); }
  .rim { fill:var(--chrome-lo); }
  .core { fill:var(--bezel-hi); }
  .core.hot { fill:var(--accent); }
  .badge { fill:var(--bezel); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-title); font-size:88px; line-height:.92; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 480×176 window slab bled off the top and right — the toxic lime takes the big block (radius-xl) · bezel-lo 300×36 header pill on it with a bezel badge in a chrome-lo ring · lcd 240×36 glass · three chrome-lo-rimmed orbs, two bezel-hi, the last accent — ≈40% of 960×288
  arrangement one window slab across the top, the launcher's section pill inside it; below, an LCD strip on the left and the corner orb row on the right, bottoms on one line space-6 above the edge
  pattern     meter segments, from "ЖК-индикаторы, сегментные шкалы": 14 cells at a space-4 pitch (12 wide + space-1 gap), nine lit in accent, five unlit in lcd-ghost; plus the orb row built from radius-pill
  scales      gutters space-4 and space-6; segment gap space-1; corners radius-xl (slab), radius-lg (pill), radius-xs (glass, segments), orbs and badge radius-pill
-->
<rect class="frame" x="16" y="-20" width="480" height="176" rx="20"/>
<rect class="pill" x="40" y="96" width="300" height="36" rx="12"/>
<circle class="rim" cx="60" cy="114" r="16"/>
<circle class="badge" cx="60" cy="114" r="12"/>
<rect class="lcd" x="24" y="208" width="240" height="36" rx="2"/>

<rect class="seg" x="128" y="216" width="12" height="20" rx="2"/>
<rect class="seg" x="144" y="216" width="12" height="20" rx="2"/>
<rect class="seg" x="160" y="216" width="12" height="20" rx="2"/>
<rect class="seg off" x="176" y="216" width="12" height="20" rx="2"/>
<rect class="seg off" x="192" y="216" width="12" height="20" rx="2"/>
<rect class="seg off" x="208" y="216" width="12" height="20" rx="2"/>

<circle class="rim" cx="288" cy="222" r="30"/><circle class="core" cx="288" cy="222" r="25"/>
<circle class="rim" cx="360" cy="222" r="30"/><circle class="core" cx="360" cy="222" r="25"/>
<circle class="rim" cx="432" cy="222" r="30"/><circle class="core hot" cx="432" cy="222" r="25"/>
</svg>
</div>
<div class="words">
<h1 class="name">oldge-ui</h1>
<p class="tag">Ядовитый глянец и синее сияние — нулевые в кармане.</p>
</div>
</div>
</body>
</html>
