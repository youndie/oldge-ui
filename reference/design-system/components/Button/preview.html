<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo' },
    h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' } }, h(B.Button, { variant: 'primary', icon: 'upload' }, 'Отправить'), h(B.Button, null, 'Отмена'), h(B.Button, { variant: 'plain' }, 'Подробнее')),
    h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' } }, h(B.Button, { size: 'sm', icon: 'folder' }, 'Обзор…'), h(B.Button, { icon: 'search', 'aria-label': 'Поиск' }), h(B.Button, { variant: 'primary', size: 'sm' }, 'OK'), h(B.Button, { disabled: true }, 'Недоступна')),
    h(B.Button, { variant: 'primary', size: 'lg', block: true }, 'Продолжить')));
</script>
</body>
</html>
