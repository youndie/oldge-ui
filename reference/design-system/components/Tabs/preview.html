<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Tabs — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function Demo() { var v = React.useState('gen');
    var body = { gen: 'Имя, значок и размер папки.', share: 'Кому доступна папка и по какой ссылке.', hist: 'Кто и когда менял содержимое.' };
    return h('div', { className: 'og-demo' }, h(B.Tabs, { label: 'Свойства папки', value: v[0], onChange: v[1], items: [
      { id: 'gen', label: 'Общие' }, { id: 'share', label: 'Доступ', badge: '2' }, { id: 'hist', label: 'История' }] }, body[v[0]])); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
