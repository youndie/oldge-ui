<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Slider — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function Demo() { var s = React.useState(0.6);
    return h('div', { className: 'og-demo' }, h(B.Slider, { label: 'Громкость', value: s[0], onChange: s[1], valueText: Math.round(s[0] * 100) + '%' })); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
