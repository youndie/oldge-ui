<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ChatBubble — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo', style: { gap: 8 } },
    h(B.ChatBubble, { from: 'them', avatar: h(B.Avatar, { size: 'sm', name: 'Анна Ким' }), time: '09:12' }, 'Скинула фото из поездки, посмотри вечером'),
    h(B.ChatBubble, { from: 'me', time: '09:14', status: 'read' }, 'Уже смотрю. Горы — огонь.'),
    h(B.ChatBubble, { from: 'me', time: '09:14', status: 'sent', tail: false }, 'Можно я возьму пару на обои?')));
</script>
</body>
</html>
