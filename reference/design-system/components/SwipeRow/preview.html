<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>SwipeRow — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'og-demo' }, h(B.List, null,
    h(B.SwipeRow, { defaultOpen: true, actions: [{ icon: 'folder', label: 'Архив' }, { icon: 'trash', label: 'Удалить', tone: 'danger' }] },
      h(B.ListItem, { icon: 'mail', title: 'Анна Ким', subtitle: 'Смахните влево', value: '09:14', onPress: function () {} })),
    h(B.SwipeRow, { actions: [{ icon: 'star', label: 'Важное', tone: 'accent' }, { icon: 'trash', label: 'Удалить', tone: 'danger' }] },
      h(B.ListItem, { icon: 'mail', title: 'Иван Ли', subtitle: 'Потяните строку', value: 'чт', onPress: function () {} })))));
</script>
</body>
</html>
