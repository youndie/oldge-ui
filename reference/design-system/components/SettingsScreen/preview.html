<!-- @dsCard group="Экраны" height=800 subtitle="Формы и списки в одном экране" page -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>SettingsScreen — preview</title>
<style>
.phone { width: 390px; height: 760px; margin: 16px; display: flex; flex-direction: column; border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-window); position: relative;
    background: radial-gradient(120% 60% at 100% 100%, var(--glow), transparent 60%), linear-gradient(var(--body-hi), var(--ground) 70%); }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .scroll > * { flex-shrink: 0; }
  .display { margin: var(--space-2) 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--space-2); }
</style></head>
<body>
<div id="root"></div>
<script>
  var B = window.OldgeUI, h = React.createElement;
  function App() {
    var q = React.useState('hi'), vol = React.useState(0.6), net = React.useState('wifi'), nav = React.useState('me'), seg = React.useState(document.documentElement.getAttribute('data-theme') || 'toxic');
    return h('div', { className: 'phone og-textured' },
      h(B.WindowBar, { onBack: function () {}, title: 'Настройки', subtitle: 'Павел · Pro', actions: [{ icon: 'close', label: 'Закрыть' }] }),
      h('div', { className: 'scroll', style: { paddingTop: 16 } },
        h(B.Segmented, { label: 'Скин', value: seg[0], onChange: function (v) { seg[1](v); document.documentElement.setAttribute('data-theme', v); }, options: [{ id: 'toxic', label: 'Toxic' }, { id: 'media', label: 'Media' }, { id: 'crystal', label: 'Crystal' }] }),
        h(B.List, { label: 'Основное' },
          h(B.ListItem, { icon: 'user', title: 'Профиль', subtitle: 'pavel@example.com', chevron: true, onPress: function () {} }),
          h(B.ListItem, { icon: 'bell', title: 'Уведомления', trailing: h(B.Switch, { label: h('span', { className: 'og-sr' }, 'Уведомления'), defaultChecked: true }) }),
          h(B.ListItem, { icon: 'lock', title: 'Пароль и вход', value: '3 дня назад', chevron: true, onPress: function () {} })),
        h(B.Select, { label: 'Синхронизировать через', value: net[0], onChange: net[1], options: [{ value: 'wifi', label: 'Только Wi-Fi', icon: 'cloud' }, { value: 'any', label: 'Любую сеть', icon: 'refresh' }] }),
        h(B.Slider, { label: 'Громкость сигналов', value: vol[0], onChange: vol[1], valueText: Math.round(vol[0] * 100) + '%' }),
        h(B.TextField, { label: 'Имя устройства', defaultValue: 'Телефон Павла' }),
        h('div', { style: { display: 'flex', gap: 8, justifyContent: 'flex-end' } }, h(B.Button, null, 'Сбросить'), h(B.Button, { variant: 'primary' }, 'Сохранить'))),
      h(B.BottomNav, { value: nav[0], onChange: nav[1], items: [
        { id: 'home', icon: 'home', label: 'Главная' }, { id: 'search', icon: 'search', label: 'Поиск' }, { id: 'bell', icon: 'bell', label: 'События' }, { id: 'me', icon: 'user', label: 'Профиль' }] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
