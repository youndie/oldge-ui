[versions]
# The shared build conventions. The compiler, KSP, AGP and Compose Multiplatform are NOT here: they
# come from `wip`, the catalog a sborka release publishes (research §1.8).
sborka = "0.4.0.91"
# 0.6.0 records only the goldens a verification would reject and has the glyph check. Build 40 of its
# wip line is youndie/viddik@10f128b, the fix for the KSP srcDir bug (#44). 0.6.1 on Central, which
# will carry it, is not released yet, so this is the wip build from reposilite (B-35).
viddik = "0.6.0.40"
# 37 is forced by the AndroidX Compose 1.12 AAR metadata (kvadrant-ui measured 36 failing).
android-compileSdk = "37"
android-minSdk = "24"
# The sample app's Android host (B-41); not in `wip`. kvadrant-ui's version.
activityCompose = "1.13.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

[plugins]
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
